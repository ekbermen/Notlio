          class PaperPainter extends CustomPainter {
            final String pattern;
            final Color color;
            PaperPainter(this.pattern, this.color);
            @override
            void paint(Canvas canvas, Size size) {
              if (pattern == 'none') return;
              final p = Paint()
                ..color = color
                ..strokeWidth = 1;
              const step = 28.0;
              if (pattern == 'lined') {
                for (double y = step; y < size.height; y += step) {
                  canvas.drawLine(Offset(0, y), Offset(size.width, y), p);
                }
              } else if (pattern == 'grid') {
                for (double y = step; y < size.height; y += step) {
                  canvas.drawLine(Offset(0, y), Offset(size.width, y), p);
                }
                for (double x = step; x < size.width; x += step) {
                  canvas.drawLine(Offset(x, 0), Offset(x, size.height), p);
                }
              } else if (pattern == 'dots') {
                p.strokeWidth = 2.2;
                for (double y = step; y < size.height; y += step) {
                  for (double x = step; x < size.width; x += step) {
                    canvas.drawCircle(Offset(x, y), 1.2, p);
                  }
                }
              }
            }

            @override
            bool shouldRepaint(covariant PaperPainter old) => old.pattern != pattern || old.color != color;
          }

          class StrokesPainter extends CustomPainter {
            final List<Stroke> strokes;
            StrokesPainter(this.strokes);
            @override
            void paint(Canvas canvas, Size size) {
              for (final s in strokes) {
                if (s.emoji != null && s.pts.length >= 2) {
                  final tp = TextPainter(
                    text: TextSpan(text: s.emoji, style: TextStyle(fontSize: s.width * size.width / 360 * 8)),
                    textDirection: TextDirection.ltr,
                  )..layout();
                  tp.paint(canvas, Offset(s.pts[0] * size.width - tp.width / 2, s.pts[1] * size.height - tp.height / 2));
                  continue;
                }
                final p = Paint()
                  ..color = Color(s.color)
                  ..strokeWidth = s.width * size.width / 360
                  ..strokeCap = StrokeCap.round
                  ..strokeJoin = StrokeJoin.round
                  ..style = PaintingStyle.stroke;
                if (s.pts.length < 4) {
                  if (s.pts.length >= 2) {
                    canvas.drawCircle(Offset(s.pts[0] * size.width, s.pts[1] * size.height), p.strokeWidth / 2, p..style = PaintingStyle.fill);
                  }
                  continue;
                }
                final path = Path()..moveTo(s.pts[0] * size.width, s.pts[1] * size.height);
                for (var i = 2; i + 1 < s.pts.length; i += 2) {
                  path.lineTo(s.pts[i] * size.width, s.pts[i + 1] * size.height);
                }
                canvas.drawPath(path, p);
              }
            }

            @override
            bool shouldRepaint(covariant StrokesPainter old) => true;
          }

