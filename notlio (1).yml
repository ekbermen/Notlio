# ╔══════════════════════════════════════════════════════════════╗
# ║  NOTLIO  •  Not×Land                                         ║
# ║  Tek dosya: hem uygulamanın tüm kodu hem APK derleme işi.    ║
# ╚══════════════════════════════════════════════════════════════╝
#
# KULLANIM
#   1) Bu dosyayı GitHub deposuna şu yola koy:  .github/workflows/notlio.yml
#   2) Push et (ya da Actions sekmesi > "Notlio APK" > Run workflow).
#   3) Bitince APK iki yerde olur:
#        - Actions > çalışma > Artifacts > Notlio-APK
#        - Releases bölümü (telefondan indirmek en kolayı)
#
# İÇİNDEKİLER (Dart dosyaları sırayla):
#   models.dart  veri modeli, saklama, AES şifreleme, parola
#   runner.dart  kod çalıştırma (JS/HTML/CSS/JSON/XML/YAML yerelde, diğerleri sunucuda)
#   ai.dart      API anahtarı analizi, şirket/model seçimi, AI paneli
#   common.dart  emoji/sticker setleri, renkler, kâğıt desenleri, not kartı
#   editor.dart  öğrenci not editörü + çizim sayfası
#   code.dart    yazılımcı editörü (renklendirme, satır no, ▶ çalıştır)
#   logo.dart    Notlio logosu (kodla çizilir)
#   ui.dart      ana ekran, defterler, arama, ayarlar, çöp kutusu, kilit
#   main.dart    giriş noktası ve tema
#
name: Notlio APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/notlio.yml'

permissions:
  contents: write

concurrency:
  group: notlio-build
  cancel-in-progress: true

jobs:
  build:
    name: APK derle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: "Depoyu al"
        uses: actions/checkout@v4

      - name: "Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: "Flutter kur"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: "Flutter projesini oluştur"
        run: |
          flutter --version
          flutter create --org com.notlio --project-name notlio --platforms android --description "Notlio - Not x Land" app
          rm -rf app/test
          rm -f app/lib/main.dart
          rm -f app/analysis_options.yaml

      - name: "pubspec.yaml"
        working-directory: app
        run: |
          cat > pubspec.yaml << 'NOTLIOEOF'
          name: notlio
          description: Notlio - Not x Land
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.5.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            path_provider: ^2.1.4
            http: ^1.2.2
            crypto: ^3.0.5
            encrypt: ^5.0.3
            file_picker: ^8.1.2
            image_picker: ^1.1.2
            share_plus: ^10.0.2
            speech_to_text: ^7.0.0
            webview_flutter: ^4.9.0
            audioplayers: ^6.1.0
            open_filex: ^4.5.0

          flutter:
            uses-material-design: true
          NOTLIOEOF

      - name: "Android ayarları (izinler, SDK, ad)"
        working-directory: app
        run: |
          python3 - << 'NOTLIOEOF'
          import re
          mf = 'android/app/src/main/AndroidManifest.xml'
          s = open(mf, encoding='utf-8').read()
          perms = (
              '    <uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
              '    <uses-permission android:name="android.permission.CAMERA"/>\n'
              '    <uses-permission android:name="android.permission.BLUETOOTH"/>\n'
              '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n'
          )
          s = s.replace('<application', perms + '    <application', 1)
          extra = (
              '<intent><action android:name="android.speech.RecognitionService"/></intent>'
              '<intent><action android:name="android.intent.action.VIEW"/><data android:mimeType="application/pdf"/></intent>'
              '<intent><action android:name="android.intent.action.VIEW"/><data android:mimeType="*/*"/></intent>'
          )
          if '<queries>' in s:
              s = s.replace('<queries>', '<queries>' + extra, 1)
          else:
              s = s.replace('</manifest>', '<queries>' + extra + '</queries></manifest>', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Notlio"', s, count=1)
          open(mf, 'w', encoding='utf-8').write(s)

          import glob
          for g in glob.glob('android/app/build.gradle*'):
              t = open(g, encoding='utf-8').read()
              t = re.sub(r'compileSdk(Version)?\s*=?\s*flutter\.compileSdkVersion', 'compileSdk = 35', t)
              t = re.sub(r'minSdk(Version)?\s*=?\s*flutter\.minSdkVersion', 'minSdk = 24', t)
              open(g, 'w', encoding='utf-8').write(t)

          for g in glob.glob('android/settings.gradle*') + glob.glob('android/build.gradle*'):
              t = open(g, encoding='utf-8').read()
              t2 = re.sub(r'(org\.jetbrains\.kotlin\.android"?\s*\)?\s*version\s*"?)1\.[78]\.\d+', r'\g<1>1.9.24', t)
              t2 = re.sub(r"(ext\.kotlin_version\s*=\s*')1\.[78]\.\d+", r'\g<1>1.9.24', t2)
              if t2 != t:
                  open(g, 'w', encoding='utf-8').write(t2)
                  print('Kotlin guncellendi:', g)

          with open('android/gradle.properties', 'a', encoding='utf-8') as f:
              f.write('\nandroid.suppressUnsupportedCompileSdk=35\n')
              f.write('org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G\n')
          print(open(mf, encoding='utf-8').read())
          NOTLIOEOF

      - name: "Logo ve uygulama ikonu (kodla uretilir)"
        working-directory: app
        run: |
          pip install pillow
          python3 - << 'NOTLIOEOF'
          import os
          from PIL import Image, ImageDraw

          S = 1024
          VIOLET = (108, 92, 231)
          PINK = (253, 121, 168)

          def gradient(size):
              img = Image.new('RGB', (size, size))
              px = img.load()
              for y in range(size):
                  for x in range(size):
                      t = (x + y) / (2.0 * (size - 1))
                      px[x, y] = tuple(int(VIOLET[i] + (PINK[i] - VIOLET[i]) * t) for i in range(3))
              return img.convert('RGBA')

          def star(d, cx, cy, r, fill):
              k = r * 0.22
              d.polygon([(cx, cy - r), (cx + k, cy - k), (cx + r, cy), (cx + k, cy + k),
                         (cx, cy + r), (cx - k, cy + k), (cx - r, cy), (cx - k, cy - k)], fill=fill)

          def foreground():
              # transparent layer, logo inside the adaptive-icon safe zone
              img = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)
              x0, y0, x1, y1 = 300, 250, 724, 774
              fold = 120
              page = (255, 255, 255, 255)
              d.polygon([(x0, y0), (x1 - fold, y0), (x1, y0 + fold), (x1, y1), (x0, y1)], fill=page)
              d.polygon([(x1 - fold, y0), (x1, y0 + fold), (x1 - fold, y0 + fold)], fill=(215, 208, 250, 255))
              line = (160, 150, 235, 255)
              for i, (ya, w) in enumerate([(430, 300), (510, 300), (590, 200)]):
                  d.rounded_rectangle([x0 + 50, ya, x0 + 50 + w - 100 + 100, ya + 30], radius=15, fill=line)
              star(d, x1 - 20, y1 - 30, 105, (253, 203, 110, 255))
              star(d, x1 + 90, y1 - 150, 44, (255, 255, 255, 255))
              return img

          def make(size, img):
              return img.resize((size, size), Image.LANCZOS)

          bg = gradient(S)
          fg = foreground()
          full = bg.copy()
          full.alpha_composite(fg)

          # legacy rounded icon
          mask = Image.new('L', (S, S), 0)
          ImageDraw.Draw(mask).rounded_rectangle([0, 0, S - 1, S - 1], radius=int(S * 0.22), fill=255)
          legacy = Image.new('RGBA', (S, S), (0, 0, 0, 0))
          legacy.paste(full, (0, 0), mask)

          legacy_sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          adaptive_sizes = {'mdpi': 108, 'hdpi': 162, 'xhdpi': 216, 'xxhdpi': 324, 'xxxhdpi': 432}
          res = 'android/app/src/main/res'
          for dens, sz in legacy_sizes.items():
              folder = f'{res}/mipmap-{dens}'
              os.makedirs(folder, exist_ok=True)
              make(sz, legacy).save(f'{folder}/ic_launcher.png')
              make(sz, legacy).save(f'{folder}/ic_launcher_round.png')
          for dens, sz in adaptive_sizes.items():
              folder = f'{res}/mipmap-{dens}'
              make(sz, fg).save(f'{folder}/ic_launcher_foreground.png')
              make(sz, bg).save(f'{folder}/ic_launcher_background.png')

          os.makedirs(f'{res}/mipmap-anydpi-v26', exist_ok=True)
          xml = ('<?xml version="1.0" encoding="utf-8"?>\n'
                 '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                 '    <background android:drawable="@mipmap/ic_launcher_background"/>\n'
                 '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
                 '</adaptive-icon>\n')
          open(f'{res}/mipmap-anydpi-v26/ic_launcher.xml', 'w').write(xml)
          open(f'{res}/mipmap-anydpi-v26/ic_launcher_round.xml', 'w').write(xml)
          print('Ikon dosyalari hazir')
          NOTLIOEOF

      - name: "lib/models.dart (veri modeli, saklama, şifreleme)"
        working-directory: app
        run: |
          cat > lib/models.dart << 'NOTLIOEOF'
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'dart:typed_data';
          import 'package:crypto/crypto.dart';
          import 'package:encrypt/encrypt.dart' as enc;
          import 'package:flutter/foundation.dart';
          import 'package:path_provider/path_provider.dart';

          const int kMaxNotebookChars = 5000000;
          const int kAiMaxChars = 1000000;

          int _idCounter = 0;
          String newId() {
            _idCounter++;
            return '${DateTime.now().microsecondsSinceEpoch}$_idCounter';
          }

          class Attachment {
            String type; // image, gif, audio, file, sticker
            String path;
            String name;
            Attachment({required this.type, required this.path, this.name = ''});
            Map<String, dynamic> toJson() => {'type': type, 'path': path, 'name': name};
            factory Attachment.fromJson(Map<String, dynamic> j) => Attachment(
                  type: (j['type'] ?? 'file').toString(),
                  path: (j['path'] ?? '').toString(),
                  name: (j['name'] ?? '').toString(),
                );
          }

          class Stroke {
            int color;
            double width;
            List<double> pts; // normalized 0..1 (x,y,x,y...)
            String? emoji;
            Stroke(this.color, this.width, this.pts, {this.emoji});
            Map<String, dynamic> toJson() => {'c': color, 'w': width, 'p': pts, 'e': emoji};
            factory Stroke.fromJson(Map<String, dynamic> j) => Stroke(
                  (j['c'] as num?)?.toInt() ?? 0xFF000000,
                  (j['w'] as num?)?.toDouble() ?? 3.0,
                  ((j['p'] as List?) ?? []).map((e) => (e as num).toDouble()).toList(),
                  emoji: j['e'] as String?,
                );
          }

          class Note {
            String id;
            String title;
            String text;
            String lang; // '' = normal note, otherwise code language id
            int bg; // 0 = default
            String pattern; // none, lined, grid, dots
            bool pinned;
            bool trashed;
            int created;
            int updated;
            int trashedAt;
            List<Attachment> atts;
            List<Stroke> strokes;
            List<String> tags;

            Note({
              String? id,
              this.title = '',
              this.text = '',
              this.lang = '',
              this.bg = 0,
              this.pattern = 'none',
              this.pinned = false,
              this.trashed = false,
              this.trashedAt = 0,
              int? created,
              int? updated,
              List<Attachment>? atts,
              List<Stroke>? strokes,
              List<String>? tags,
            })  : id = id ?? newId(),
                  created = created ?? DateTime.now().millisecondsSinceEpoch,
                  updated = updated ?? DateTime.now().millisecondsSinceEpoch,
                  atts = atts ?? [],
                  strokes = strokes ?? [],
                  tags = tags ?? [];

            bool get isCode => lang.isNotEmpty;

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'title': title,
                  'text': text,
                  'lang': lang,
                  'bg': bg,
                  'pattern': pattern,
                  'pinned': pinned,
                  'trashed': trashed,
                  'trashedAt': trashedAt,
                  'created': created,
                  'updated': updated,
                  'atts': atts.map((e) => e.toJson()).toList(),
                  'strokes': strokes.map((e) => e.toJson()).toList(),
                  'tags': tags,
                };

            factory Note.fromJson(Map<String, dynamic> j) => Note(
                  id: j['id']?.toString(),
                  title: (j['title'] ?? '').toString(),
                  text: (j['text'] ?? '').toString(),
                  lang: (j['lang'] ?? '').toString(),
                  bg: (j['bg'] as num?)?.toInt() ?? 0,
                  pattern: (j['pattern'] ?? 'none').toString(),
                  pinned: j['pinned'] == true,
                  trashed: j['trashed'] == true,
                  trashedAt: (j['trashedAt'] as num?)?.toInt() ?? 0,
                  created: (j['created'] as num?)?.toInt(),
                  updated: (j['updated'] as num?)?.toInt(),
                  atts: ((j['atts'] as List?) ?? [])
                      .map((e) => Attachment.fromJson(Map<String, dynamic>.from(e as Map)))
                      .toList(),
                  strokes: ((j['strokes'] as List?) ?? [])
                      .map((e) => Stroke.fromJson(Map<String, dynamic>.from(e as Map)))
                      .toList(),
                  tags: ((j['tags'] as List?) ?? []).map((e) => e.toString()).toList(),
                );
          }

          class Notebook {
            String id;
            String name;
            String kind; // student | dev
            String emoji;
            List<Note> notes;
            Notebook({String? id, required this.name, required this.kind, this.emoji = '📒', List<Note>? notes})
                : id = id ?? newId(),
                  notes = notes ?? [];

            int get chars => notes.fold<int>(0, (s, n) => s + n.text.length + n.title.length);

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'name': name,
                  'kind': kind,
                  'emoji': emoji,
                  'notes': notes.map((e) => e.toJson()).toList(),
                };

            factory Notebook.fromJson(Map<String, dynamic> j) => Notebook(
                  id: j['id']?.toString(),
                  name: (j['name'] ?? 'Defter').toString(),
                  kind: (j['kind'] ?? 'student').toString(),
                  emoji: (j['emoji'] ?? '📒').toString(),
                  notes: ((j['notes'] as List?) ?? [])
                      .map((e) => Note.fromJson(Map<String, dynamic>.from(e as Map)))
                      .toList(),
                );
          }

          class Hit {
            final Notebook notebook;
            final Note note;
            Hit(this.notebook, this.note);
          }

          class Store extends ChangeNotifier {
            static final Store I = Store._();
            Store._();

            List<Notebook> notebooks = [];
            bool dark = false;
            int accent = 0xFF6C5CE7;
            double fontSize = 16;
            String apiKey = '';
            String provider = '';
            String baseUrl = '';
            String model = '';
            List<String> models = [];
            String pistonUrl = 'https://emkc.org/api/v2/piston/execute';
            bool encrypted = false;
            bool locked = false;
            bool ready = false;
            String? _pass;
            late Directory dir;
            Timer? _timer;

            File get _dataFile => File('${dir.path}/notlio_data.json');
            File get _lockFile => File('${dir.path}/notlio_lock.txt');
            bool get hasLock => _lockFile.existsSync();
            bool get hasAi => apiKey.isNotEmpty && provider.isNotEmpty;

            String _hash(String p) => sha256.convert(utf8.encode('notlio::$p')).toString();

            enc.Key _key(String p) => enc.Key(Uint8List.fromList(sha256.convert(utf8.encode('notlio-aes::$p')).bytes));

            String _encrypt(String plain, String p) {
              final iv = enc.IV.fromSecureRandom(16);
              final e = enc.Encrypter(enc.AES(_key(p), mode: enc.AESMode.cbc));
              final out = e.encrypt(plain, iv: iv);
              return 'NLE1:${iv.base64}:${out.base64}';
            }

            String _decrypt(String raw, String p) {
              final parts = raw.split(':');
              final e = enc.Encrypter(enc.AES(_key(p), mode: enc.AESMode.cbc));
              return e.decrypt(enc.Encrypted.fromBase64(parts[2]), iv: enc.IV.fromBase64(parts[1]));
            }

            Future<void> init() async {
              dir = await getApplicationDocumentsDirectory();
              await Directory('${dir.path}/media').create(recursive: true);
              if (_dataFile.existsSync()) {
                final raw = await _dataFile.readAsString();
                if (raw.startsWith('NLE1:')) {
                  encrypted = true;
                  locked = true;
                } else {
                  _parse(raw);
                  locked = hasLock;
                }
              } else {
                _seed();
                await saveNow();
              }
              ready = true;
              notifyListeners();
            }

            void _parse(String raw) {
              try {
                final j = jsonDecode(raw) as Map<String, dynamic>;
                final s = Map<String, dynamic>.from((j['settings'] as Map?) ?? {});
                dark = s['dark'] == true;
                accent = (s['accent'] as num?)?.toInt() ?? 0xFF6C5CE7;
                fontSize = (s['fontSize'] as num?)?.toDouble() ?? 16;
                apiKey = (s['apiKey'] ?? '').toString();
                provider = (s['provider'] ?? '').toString();
                baseUrl = (s['baseUrl'] ?? '').toString();
                model = (s['model'] ?? '').toString();
                models = ((s['models'] as List?) ?? []).map((e) => e.toString()).toList();
                pistonUrl = (s['pistonUrl'] ?? pistonUrl).toString();
                notebooks = ((j['notebooks'] as List?) ?? [])
                    .map((e) => Notebook.fromJson(Map<String, dynamic>.from(e as Map)))
                    .toList();
                final limit = DateTime.now().millisecondsSinceEpoch - 30 * 24 * 3600 * 1000;
                for (final nb in notebooks) {
                  nb.notes.removeWhere((n) => n.trashed && n.trashedAt > 0 && n.trashedAt < limit);
                }
              } catch (e) {
                notebooks = [];
              }
              if (notebooks.isEmpty) _seed();
            }

            void _seed() {
              notebooks = [
                Notebook(name: 'Derslerim', kind: 'student', emoji: '🎓', notes: [
                  Note(
                    title: 'Not×Land\'e hoş geldin 👋',
                    text: 'Notlio\'da her defter bir diyar.\n\n'
                        '☐ Sağ alttaki + ile yeni not aç\n'
                        '☐ Üstteki ✦ simgesiyle yapay zekayı çağır\n'
                        '☐ Alttaki araç çubuğuyla emoji, sticker, resim, GIF, ses, PDF ve çizim ekle\n'
                        '☐ Yazılımcı sekmesinde kodu ▶ ile çalıştır\n\n'
                        'Hesap yok, reklam yok, her şey telefonunda.',
                    pinned: true,
                    pattern: 'lined',
                  ),
                ]),
                Notebook(name: 'Kodlarım', kind: 'dev', emoji: '💻', notes: [
                  Note(title: 'Merhaba JS', lang: 'js', text: "console.log('Merhaba Notlio!');\nfor (let i = 1; i <= 3; i++) {\n  console.log('Sayı: ' + i);\n}\n"),
                ]),
              ];
            }

            Map<String, dynamic> _toMap() => {
                  'v': 1,
                  'settings': {
                    'dark': dark,
                    'accent': accent,
                    'fontSize': fontSize,
                    'apiKey': apiKey,
                    'provider': provider,
                    'baseUrl': baseUrl,
                    'model': model,
                    'models': models,
                    'pistonUrl': pistonUrl,
                  },
                  'notebooks': notebooks.map((e) => e.toJson()).toList(),
                };

            void save() {
              _timer?.cancel();
              _timer = Timer(const Duration(milliseconds: 600), () {
                saveNow();
              });
            }

            void refresh() {
              save();
              notifyListeners();
            }

            Future<void> saveNow() async {
              if (locked) return;
              try {
                var s = jsonEncode(_toMap());
                if (encrypted && _pass != null) s = _encrypt(s, _pass!);
                final tmp = File('${_dataFile.path}.tmp');
                await tmp.writeAsString(s, flush: true);
                await tmp.rename(_dataFile.path);
              } catch (e) {
                debugPrint('save error: $e');
              }
            }

            Future<bool> unlock(String p) async {
              try {
                if (encrypted) {
                  final raw = await _dataFile.readAsString();
                  final plain = _decrypt(raw, p);
                  _parse(plain);
                  _pass = p;
                  locked = false;
                  notifyListeners();
                  return true;
                }
                if (_lockFile.existsSync() && (await _lockFile.readAsString()).trim() == _hash(p)) {
                  _pass = p;
                  locked = false;
                  notifyListeners();
                  return true;
                }
              } catch (e) {
                return false;
              }
              return false;
            }

            Future<void> setLock(String p, bool encrypt) async {
              await _lockFile.writeAsString(_hash(p));
              _pass = p;
              encrypted = encrypt;
              await saveNow();
              notifyListeners();
            }

            Future<void> setEncrypt(bool v) async {
              if (v && _pass == null) return;
              encrypted = v;
              await saveNow();
              notifyListeners();
            }

            Future<void> removeLock() async {
              if (_lockFile.existsSync()) await _lockFile.delete();
              encrypted = false;
              _pass = null;
              await saveNow();
              notifyListeners();
            }

            // ---- queries ----
            List<Notebook> byKind(String kind) => notebooks.where((n) => n.kind == kind).toList();

            List<Hit> allHits({bool trashed = false}) {
              final out = <Hit>[];
              for (final nb in notebooks) {
                for (final n in nb.notes) {
                  if (n.trashed == trashed) out.add(Hit(nb, n));
                }
              }
              return out;
            }

            Notebook? notebookOf(Note n) {
              for (final nb in notebooks) {
                if (nb.notes.any((x) => x.id == n.id)) return nb;
              }
              return null;
            }

            List<Note> sortedNotes(Notebook nb) {
              final l = nb.notes.where((n) => !n.trashed).toList();
              l.sort((a, b) {
                if (a.pinned != b.pinned) return a.pinned ? -1 : 1;
                return b.updated.compareTo(a.updated);
              });
              return l;
            }

            void trash(Note n) {
              n.trashed = true;
              n.pinned = false;
              n.trashedAt = DateTime.now().millisecondsSinceEpoch;
              refresh();
            }

            void restore(Note n) {
              n.trashed = false;
              n.trashedAt = 0;
              n.updated = DateTime.now().millisecondsSinceEpoch;
              refresh();
            }

            void deleteForever(Note n) {
              for (final nb in notebooks) {
                nb.notes.removeWhere((x) => x.id == n.id);
              }
              refresh();
            }

            void moveNote(Note n, Notebook to) {
              for (final nb in notebooks) {
                nb.notes.removeWhere((x) => x.id == n.id);
              }
              to.notes.add(n);
              refresh();
            }

            Note duplicate(Note n, Notebook nb) {
              final c = Note.fromJson(Map<String, dynamic>.from(jsonDecode(jsonEncode(n.toJson())) as Map));
              c.id = newId();
              c.title = '${n.title} (kopya)';
              c.pinned = false;
              nb.notes.add(c);
              refresh();
              return c;
            }

            String contextFor(String scope, Notebook? nb, Note? note) {
              if (scope == 'note' && note != null) {
                final head = note.isCode ? 'Kod notu (${note.lang}): ${note.title}\n' : 'Not: ${note.title}\n';
                return head + note.text;
              }
              final buf = StringBuffer();
              final hits = <Hit>[];
              if (scope == 'notebook' && nb != null) {
                for (final n in nb.notes.where((n) => !n.trashed)) {
                  hits.add(Hit(nb, n));
                }
              } else if (scope == 'all') {
                hits.addAll(allHits());
              }
              hits.sort((a, b) => b.note.updated.compareTo(a.note.updated));
              for (final h in hits) {
                final piece = '### [${h.notebook.name}] ${h.note.title}\n${h.note.text}\n\n';
                if (buf.length + piece.length > kAiMaxChars) break;
                buf.write(piece);
              }
              return buf.toString();
            }

            Future<String> keepFile(String src, String name) async {
              final safe = name.replaceAll(RegExp(r'[^A-Za-z0-9._-]'), '_');
              final dest = '${dir.path}/media/${DateTime.now().millisecondsSinceEpoch}_$safe';
              await File(src).copy(dest);
              return dest;
            }

            Future<File> exportFile() async {
              final tmp = await getTemporaryDirectory();
              final f = File('${tmp.path}/notlio_yedek.json');
              final m = _toMap();
              (m['settings'] as Map<String, dynamic>)['apiKey'] = '';
              await f.writeAsString(jsonEncode(m));
              return f;
            }

            int importJson(String raw) {
              final j = jsonDecode(raw) as Map<String, dynamic>;
              final list = ((j['notebooks'] as List?) ?? [])
                  .map((e) => Notebook.fromJson(Map<String, dynamic>.from(e as Map)))
                  .toList();
              for (final nb in list) {
                final idx = notebooks.indexWhere((x) => x.id == nb.id);
                if (idx >= 0) {
                  notebooks[idx] = nb;
                } else {
                  notebooks.add(nb);
                }
              }
              refresh();
              return list.length;
            }
          }
          NOTLIOEOF

      - name: "lib/runner.dart (kod çalıştırma motoru)"
        working-directory: app
        run: |
          cat > lib/runner.dart << 'NOTLIOEOF'
          import 'dart:async';
          import 'dart:convert';
          import 'package:http/http.dart' as http;
          import 'models.dart';

          class LangInfo {
            final String id, name, ext, piston, starter;
            final bool local;
            const LangInfo(this.id, this.name, this.ext, this.piston, this.local, this.starter);
          }

          const List<LangInfo> kLangs = [
            LangInfo('cpp', 'C++', 'cpp', 'c++', false,
                '#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Merhaba Notlio!" << endl;\n    return 0;\n}\n'),
            LangInfo('c', 'C', 'c', 'c', false,
                '#include <stdio.h>\n\nint main() {\n    printf("Merhaba Notlio!\\n");\n    return 0;\n}\n'),
            LangInfo('csharp', 'C#', 'cs', 'csharp', false,
                'using System;\n\nclass Program {\n    static void Main() {\n        Console.WriteLine("Merhaba Notlio!");\n    }\n}\n'),
            LangInfo('html', 'HTML', 'html', '', true,
                '<!DOCTYPE html>\n<html>\n<body style="font-family:sans-serif;text-align:center">\n  <h1>Merhaba Notlio!</h1>\n  <button onclick="this.textContent=\'Çalışıyor!\'">Tıkla</button>\n</body>\n</html>\n'),
            LangInfo('css', 'CSS', 'css', '', true,
                'body { background: #fdf6e3; font-family: sans-serif; }\nh1 { color: #6c5ce7; text-align: center; }\np { color: #444; }\nbutton { padding: 10px 18px; border-radius: 12px; }\n'),
            LangInfo('json', 'JSON', 'json', '', true, '{\n  "ad": "Notlio",\n  "surum": 1,\n  "ozellikler": ["not", "kod", "ai"]\n}\n'),
            LangInfo('js', 'JavaScript', 'js', '', true,
                "console.log('Merhaba Notlio!');\nconst kare = x => x * x;\nconsole.log([1, 2, 3].map(kare));\n"),
            LangInfo('python', 'Python', 'py', 'python', false,
                'print("Merhaba Notlio!")\nfor i in range(3):\n    print("Sayı:", i)\n'),
            LangInfo('xml', 'XML', 'xml', '', true,
                '<?xml version="1.0" encoding="UTF-8"?>\n<notlar>\n  <not id="1">Merhaba</not>\n</notlar>\n'),
            LangInfo('yaml', 'YAML', 'yml', '', true, 'ad: Notlio\nsurum: 1\nozellikler:\n  - not\n  - kod\n  - ai\n'),
            LangInfo('java', 'Java', 'java', 'java', false,
                'public class Main {\n    public static void main(String[] args) {\n        System.out.println("Merhaba Notlio!");\n    }\n}\n'),
            LangInfo('kotlin', 'Kotlin', 'kt', 'kotlin', false, 'fun main() {\n    println("Merhaba Notlio!")\n}\n'),
            LangInfo('php', 'PHP', 'php', 'php', false, '<?php\necho "Merhaba Notlio!\\n";\n'),
            LangInfo('go', 'Go', 'go', 'go', false,
                'package main\n\nimport "fmt"\n\nfunc main() {\n    fmt.Println("Merhaba Notlio!")\n}\n'),
            LangInfo('rust', 'Rust', 'rs', 'rust', false, 'fn main() {\n    println!("Merhaba Notlio!");\n}\n'),
            LangInfo('sql', 'SQL', 'sql', 'sqlite3', false,
                "CREATE TABLE notlar (id INTEGER, baslik TEXT);\nINSERT INTO notlar VALUES (1, 'Merhaba');\nSELECT * FROM notlar;\n"),
          ];

          LangInfo langOf(String id) => kLangs.firstWhere((l) => l.id == id, orElse: () => kLangs.first);

          class RunResult {
            final String stdout;
            final String stderr;
            final String? html;
            final bool ok;
            RunResult({this.stdout = '', this.stderr = '', this.html, this.ok = true});
          }

          int _lineAt(String s, int offset) {
            if (offset < 0) return 1;
            final end = offset > s.length ? s.length : offset;
            return '\n'.allMatches(s.substring(0, end)).length + 1;
          }

          Future<RunResult> runCode(String lang, String code, {String stdin = ''}) async {
            final info = langOf(lang);
            switch (lang) {
              case 'html':
                return RunResult(html: code);
              case 'css':
                return RunResult(
                    html: '<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>$code</style></head>'
                        '<body><h1>Başlık</h1><p>Bu bir örnek paragraftır. CSS kodun burada uygulanır.</p>'
                        '<button>Düğme</button><ul><li>Bir</li><li>İki</li></ul></body></html>');
              case 'js':
                final src = jsonEncode(code).replaceAll('</', '<\\/');
                return RunResult(
                    html: '<html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head>'
                        '<body style="font-family:monospace;padding:8px;font-size:14px"><pre id="o" style="white-space:pre-wrap"></pre><script>'
                        'var o=document.getElementById("o");'
                        'function w(a){o.textContent+=Array.prototype.map.call(a,function(x){try{return typeof x==="object"?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(" ")+"\\n"}'
                        'console.log=function(){w(arguments)};console.info=console.log;console.warn=console.log;'
                        'console.error=function(){w(["HATA:"].concat([].slice.call(arguments)))};'
                        'window.onerror=function(m,s,l){o.textContent+="HATA: "+m+"\\n"};'
                        'try{(0,eval)($src)}catch(e){o.textContent+="HATA: "+e.name+": "+e.message+"\\n"}'
                        '</script></body></html>');
              case 'json':
                try {
                  final v = jsonDecode(code);
                  return RunResult(stdout: const JsonEncoder.withIndent('  ').convert(v));
                } on FormatException catch (e) {
                  return RunResult(stderr: 'JSON hatası (satır ${_lineAt(code, e.offset ?? -1)}): ${e.message}', ok: false);
                }
              case 'xml':
                final xerr = _xmlCheck(code);
                if (xerr != null) return RunResult(stderr: xerr, ok: false);
                final n = RegExp(r'<[A-Za-z_]').allMatches(code).length;
                return RunResult(stdout: 'XML geçerli ✓  ($n etiket)');
              case 'yaml':
                final yerr = _yamlCheck(code);
                if (yerr != null) return RunResult(stderr: yerr, ok: false);
                final keys = RegExp(r'^[A-Za-z_][\w\- ]*:', multiLine: true).allMatches(code).length;
                return RunResult(stdout: 'Temel YAML denetimi geçti ✓  ($keys üst düzey anahtar)');
            }
            return _piston(info, code, stdin);
          }

          String? _xmlCheck(String src) {
            var s = src.replaceAllMapped(RegExp(r'<!--[\s\S]*?-->|<!\[CDATA\[[\s\S]*?\]\]>|<\?[\s\S]*?\?>|<!DOCTYPE[^>]*>'),
                (m) => m.group(0)!.replaceAll(RegExp(r'[^\n]'), ' '));
            final stack = <MapEntry<String, int>>[];
            final re = RegExp(r'<(/?)([A-Za-z_][\w:.\-]*)([^<>]*?)(/?)>');
            var roots = 0;
            for (final m in re.allMatches(s)) {
              final line = _lineAt(s, m.start);
              final closing = m.group(1) == '/';
              final name = m.group(2)!;
              final selfClose = m.group(4) == '/';
              if (closing) {
                if (stack.isEmpty) return 'XML hatası (satır $line): </$name> için açılış etiketi yok';
                final top = stack.removeLast();
                if (top.key != name) {
                  return 'XML hatası (satır $line): <${top.key}> (satır ${top.value}) kapatılmadan </$name> geldi';
                }
              } else if (!selfClose) {
                if (stack.isEmpty) roots++;
                stack.add(MapEntry(name, line));
              } else if (stack.isEmpty) {
                roots++;
              }
            }
            if (stack.isNotEmpty) return 'XML hatası (satır ${stack.last.value}): <${stack.last.key}> etiketi kapatılmamış';
            if (roots == 0) return 'XML hatası: hiç etiket bulunamadı';
            if (roots > 1) return 'XML hatası: birden fazla kök etiket var';
            final lt = RegExp(r'<(?![A-Za-z_/])').firstMatch(s);
            if (lt != null) return 'XML hatası (satır ${_lineAt(s, lt.start)}): geçersiz "<" karakteri';
            return null;
          }

          String? _yamlCheck(String src) {
            final lines = src.split('\n');
            var square = 0, curly = 0;
            for (var i = 0; i < lines.length; i++) {
              final l = lines[i];
              final indent = RegExp(r'^[ \t]*').firstMatch(l)!.group(0)!;
              if (indent.contains('\t')) return 'YAML hatası (satır ${i + 1}): girintide TAB kullanılamaz, boşluk kullan';
              final t = l.trim();
              if (t.isEmpty || t.startsWith('#')) continue;
              for (final ch in t.split('')) {
                if (ch == '[') square++;
                if (ch == ']') square--;
                if (ch == '{') curly++;
                if (ch == '}') curly--;
              }
              final dq = '"'.allMatches(t).length;
              if (dq.isOdd && !t.contains("'")) return 'YAML hatası (satır ${i + 1}): tırnak kapatılmamış';
              if (!t.startsWith('-') && !t.contains(':') && !t.startsWith('|') && !t.startsWith('>') && indent.isEmpty) {
                return 'YAML hatası (satır ${i + 1}): "anahtar: değer" biçimi bekleniyordu';
              }
            }
            if (square != 0) return 'YAML hatası: [ ] parantezleri eşleşmiyor';
            if (curly != 0) return 'YAML hatası: { } parantezleri eşleşmiyor';
            return null;
          }

          Future<RunResult> _piston(LangInfo info, String code, String stdin) async {
            try {
              final body = jsonEncode({
                'language': info.piston,
                'version': '*',
                'files': [
                  {'name': 'main.${info.ext}', 'content': code}
                ],
                'stdin': stdin,
              });
              final r = await http
                  .post(Uri.parse(Store.I.pistonUrl), headers: {'Content-Type': 'application/json'}, body: body)
                  .timeout(const Duration(seconds: 40));
              final text = utf8.decode(r.bodyBytes);
              Map<String, dynamic> j;
              try {
                j = jsonDecode(text) as Map<String, dynamic>;
              } catch (_) {
                return RunResult(stderr: 'Sunucu cevabı anlaşılamadı (${r.statusCode}).\n$text', ok: false);
              }
              if (j['message'] != null && j['run'] == null) {
                return RunResult(
                    stderr: 'Sunucu: ${j['message']}\n\nÇalıştırma sunucusu adresini Ayarlar > Kod çalıştırma bölümünden değiştirebilirsin.',
                    ok: false);
              }
              final compile = j['compile'] as Map?;
              if (compile != null && (compile['code'] ?? 0) != 0) {
                final out = (compile['output'] ?? compile['stderr'] ?? '').toString();
                return RunResult(stderr: out, ok: false);
              }
              final run = (j['run'] as Map?) ?? {};
              final so = (run['stdout'] ?? '').toString();
              final se = (run['stderr'] ?? '').toString();
              final code0 = run['code'];
              return RunResult(stdout: so, stderr: se, ok: se.isEmpty && (code0 == null || code0 == 0));
            } on TimeoutException {
              return RunResult(stderr: 'Zaman aşımı: sunucu 40 sn içinde cevap vermedi.', ok: false);
            } catch (e) {
              return RunResult(
                  stderr: 'Çalıştırılamadı: $e\n\nBu dil için internet gerekir. Ayarlar > Kod çalıştırma bölümünden sunucu adresini kontrol et.',
                  ok: false);
            }
          }
          NOTLIOEOF

      - name: "lib/ai.dart (yapay zeka, analiz, model secimi, panel)"
        working-directory: app
        run: |
          cat > lib/ai.dart << 'NOTLIOEOF'
          import 'dart:async';
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:http/http.dart' as http;
          import 'models.dart';

          class AiCompany {
            final String id, name, base;
            const AiCompany(this.id, this.name, this.base);
          }

          const List<AiCompany> kCompanies = [
            AiCompany('openai', 'OpenAI', 'https://api.openai.com/v1'),
            AiCompany('anthropic', 'Anthropic (Claude)', 'https://api.anthropic.com/v1'),
            AiCompany('gemini', 'Google Gemini', 'https://generativelanguage.googleapis.com/v1beta'),
            AiCompany('groq', 'Groq', 'https://api.groq.com/openai/v1'),
            AiCompany('openrouter', 'OpenRouter', 'https://openrouter.ai/api/v1'),
            AiCompany('xai', 'xAI (Grok)', 'https://api.x.ai/v1'),
            AiCompany('mistral', 'Mistral', 'https://api.mistral.ai/v1'),
            AiCompany('deepseek', 'DeepSeek', 'https://api.deepseek.com/v1'),
            AiCompany('together', 'Together AI', 'https://api.together.xyz/v1'),
            AiCompany('cerebras', 'Cerebras', 'https://api.cerebras.ai/v1'),
          ];

          AiCompany? companyOf(String id) {
            for (final c in kCompanies) {
              if (c.id == id) return c;
            }
            return null;
          }

          String companyName(String id) => companyOf(id)?.name ?? (id == 'custom' ? 'Özel sağlayıcı' : id);

          class Analysis {
            final AiCompany? company;
            final List<String> models;
            final String error;
            Analysis(this.company, this.models, this.error);
          }

          class ChatMsg {
            final String role; // user | assistant
            final String text;
            ChatMsg(this.role, this.text);
          }

          String _errOf(http.Response r) {
            try {
              final j = jsonDecode(utf8.decode(r.bodyBytes));
              final e = j['error'];
              if (e is Map && e['message'] != null) return e['message'].toString();
              if (e is String) return e;
              if (j['message'] != null) return j['message'].toString();
            } catch (_) {}
            return 'HTTP ${r.statusCode}';
          }

          Future<List<String>> listModels(String id, String base, String key) async {
            Uri u;
            Map<String, String> h;
            if (id == 'anthropic') {
              u = Uri.parse('$base/models?limit=100');
              h = {'x-api-key': key, 'anthropic-version': '2023-06-01'};
            } else if (id == 'gemini') {
              u = Uri.parse('$base/models?key=$key&pageSize=200');
              h = {};
            } else {
              u = Uri.parse('$base/models');
              h = {'Authorization': 'Bearer $key'};
            }
            final r = await http.get(u, headers: h).timeout(const Duration(seconds: 10));
            if (r.statusCode != 200) throw Exception(_errOf(r));
            final j = jsonDecode(utf8.decode(r.bodyBytes));
            final out = <String>[];
            if (id == 'gemini') {
              for (final m in ((j['models'] as List?) ?? [])) {
                final methods = ((m['supportedGenerationMethods'] as List?) ?? []);
                if (methods.contains('generateContent')) {
                  out.add(m['name'].toString().replaceFirst('models/', ''));
                }
              }
            } else {
              final data = j is Map ? ((j['data'] as List?) ?? []) : (j as List);
              final skip = RegExp(r'embed|whisper|tts|moderation|dall-e|guard|rerank|transcribe|realtime|audio|image', caseSensitive: false);
              for (final m in data) {
                final mid = (m is Map ? m['id'] : m).toString();
                if (!skip.hasMatch(mid)) out.add(mid);
              }
            }
            out.sort();
            return out;
          }

          Future<Analysis> analyzeKey(String keyIn, {String customBase = ''}) async {
            final key = keyIn.trim();
            if (key.isEmpty) return Analysis(null, [], 'Anahtar boş');
            final order = <AiCompany>[];
            void add(String id) {
              final c = companyOf(id);
              if (c != null && !order.contains(c)) order.add(c);
            }

            if (customBase.trim().isNotEmpty) {
              order.add(AiCompany('custom', 'Özel sağlayıcı', customBase.trim().replaceAll(RegExp(r'/+$'), '')));
            } else {
              if (key.startsWith('sk-ant-')) {
                add('anthropic');
              } else if (key.startsWith('AIza')) {
                add('gemini');
              } else if (key.startsWith('gsk_')) {
                add('groq');
              } else if (key.startsWith('sk-or-')) {
                add('openrouter');
              } else if (key.startsWith('xai-')) {
                add('xai');
              } else if (key.startsWith('sk-')) {
                add('openai');
                add('deepseek');
              }
              for (final c in kCompanies) {
                add(c.id);
              }
            }
            var lastErr = '';
            for (final c in order) {
              try {
                final m = await listModels(c.id, c.base, key);
                if (m.isNotEmpty) return Analysis(c, m, '');
              } catch (e) {
                lastErr = e.toString().replaceFirst('Exception: ', '');
              }
            }
            return Analysis(null, [], lastErr.isEmpty ? 'Model listesi alınamadı' : lastErr);
          }

          Future<String> aiChat(List<ChatMsg> msgs, String system) async {
            final s = Store.I;
            final base = s.baseUrl;
            final key = s.apiKey;
            http.Response r;
            if (s.provider == 'anthropic') {
              r = await http
                  .post(Uri.parse('$base/messages'),
                      headers: {'x-api-key': key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json'},
                      body: jsonEncode({
                        'model': s.model,
                        'max_tokens': 8000,
                        'system': system,
                        'messages': msgs.map((m) => {'role': m.role, 'content': m.text}).toList(),
                      }))
                  .timeout(const Duration(seconds: 120));
              if (r.statusCode != 200) throw Exception(_errOf(r));
              final j = jsonDecode(utf8.decode(r.bodyBytes));
              return ((j['content'] as List?) ?? []).map((e) => (e['text'] ?? '').toString()).join();
            } else if (s.provider == 'gemini') {
              r = await http
                  .post(Uri.parse('$base/models/${s.model}:generateContent?key=$key'),
                      headers: {'content-type': 'application/json'},
                      body: jsonEncode({
                        'systemInstruction': {
                          'parts': [
                            {'text': system}
                          ]
                        },
                        'contents': msgs
                            .map((m) => {
                                  'role': m.role == 'user' ? 'user' : 'model',
                                  'parts': [
                                    {'text': m.text}
                                  ]
                                })
                            .toList(),
                      }))
                  .timeout(const Duration(seconds: 120));
              if (r.statusCode != 200) throw Exception(_errOf(r));
              final j = jsonDecode(utf8.decode(r.bodyBytes));
              final parts = (j['candidates']?[0]?['content']?['parts'] as List?) ?? [];
              return parts.map((e) => (e['text'] ?? '').toString()).join();
            } else {
              r = await http
                  .post(Uri.parse('$base/chat/completions'),
                      headers: {'Authorization': 'Bearer $key', 'content-type': 'application/json'},
                      body: jsonEncode({
                        'model': s.model,
                        'messages': [
                          {'role': 'system', 'content': system},
                          ...msgs.map((m) => {'role': m.role, 'content': m.text}),
                        ],
                      }))
                  .timeout(const Duration(seconds: 120));
              if (r.statusCode != 200) throw Exception(_errOf(r));
              final j = jsonDecode(utf8.decode(r.bodyBytes));
              return (j['choices']?[0]?['message']?['content'] ?? '').toString();
            }
          }

          Future<String> transcribeAudio(String path) async {
            final s = Store.I;
            String model;
            if (s.provider == 'groq') {
              model = 'whisper-large-v3-turbo';
            } else if (s.provider == 'openai') {
              model = 'whisper-1';
            } else {
              throw Exception('Ses dosyasını yazıya çevirmek için Groq veya OpenAI anahtarı gerekir.');
            }
            final req = http.MultipartRequest('POST', Uri.parse('${s.baseUrl}/audio/transcriptions'));
            req.headers['Authorization'] = 'Bearer ${s.apiKey}';
            req.fields['model'] = model;
            req.files.add(await http.MultipartFile.fromPath('file', path));
            final res = await req.send().timeout(const Duration(seconds: 180));
            final body = await res.stream.bytesToString();
            if (res.statusCode != 200) {
              try {
                final j = jsonDecode(body);
                throw Exception(j['error']?['message'] ?? 'HTTP ${res.statusCode}');
              } catch (e) {
                if (e is Exception && !e.toString().contains('FormatException')) rethrow;
                throw Exception('HTTP ${res.statusCode}');
              }
            }
            return (jsonDecode(body)['text'] ?? '').toString();
          }

          Future<String?> pickModel(BuildContext context, List<String> models, String current) {
            return showDialog<String>(
              context: context,
              builder: (ctx) {
                String q = '';
                return StatefulBuilder(builder: (ctx, setS) {
                  final list = models.where((m) => m.toLowerCase().contains(q.toLowerCase())).toList();
                  return AlertDialog(
                    title: const Text('Model seç'),
                    content: SizedBox(
                      width: double.maxFinite,
                      height: 420,
                      child: Column(children: [
                        TextField(
                          decoration: const InputDecoration(prefixIcon: Icon(Icons.search), hintText: 'Model ara', isDense: true),
                          onChanged: (v) => setS(() => q = v),
                        ),
                        const SizedBox(height: 8),
                        Expanded(
                          child: ListView.builder(
                            itemCount: list.length,
                            itemBuilder: (_, i) => ListTile(
                              dense: true,
                              title: Text(list[i], style: const TextStyle(fontSize: 13)),
                              trailing: list[i] == current ? const Icon(Icons.check, size: 18) : null,
                              onTap: () => Navigator.pop(ctx, list[i]),
                            ),
                          ),
                        ),
                      ]),
                    ),
                    actions: [TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Kapat'))],
