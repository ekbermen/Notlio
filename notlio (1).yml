                  decoration: BoxDecoration(color: Colors.grey.withOpacity(0.5), borderRadius: BorderRadius.circular(2)),
                ),
                Padding(
                  padding: const EdgeInsets.symmetric(horizontal: 14),
                  child: Row(children: [
                    const AiLogo(size: 30),
                    const SizedBox(width: 8),
                    const Text('Notlio AI', style: TextStyle(fontSize: 17, fontWeight: FontWeight.w800)),
                    const Spacer(),
                    Flexible(
                      child: ActionChip(
                        avatar: const Icon(Icons.memory, size: 16),
                        label: Text(s.model, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 12)),
                        onPressed: () async {
                          await changeModel(context);
                          if (mounted) setState(() {});
                        },
                      ),
                    ),
                    IconButton(icon: const Icon(Icons.close), onPressed: () => Navigator.pop(context)),
                  ]),
                ),
                SingleChildScrollView(
                  scrollDirection: Axis.horizontal,
                  padding: const EdgeInsets.symmetric(horizontal: 12),
                  child: Row(children: [
                    if (widget.note != null) _scopeChip('note', 'Bu not'),
                    if (widget.notebook != null) _scopeChip('notebook', 'Bu defter'),
                    _scopeChip('all', 'Tüm defterler'),
                    _scopeChip('none', 'Bağlamsız'),
                  ]),
                ),
                if (widget.note != null)
                  SizedBox(
                    height: 44,
                    child: ListView(
