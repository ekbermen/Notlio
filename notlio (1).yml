            try {
              final fresh = await listModels(s.provider, s.baseUrl, s.apiKey);
              if (fresh.isNotEmpty) s.models = fresh;
            } catch (_) {}
            if (!context.mounted) return;
            final m = await pickModel(context, s.models, s.model);
            if (m != null) {
              s.model = m;
              s.refresh();
            }
          }

