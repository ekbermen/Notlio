          class _CodeEditorPageState extends State<CodeEditorPage> {
            late final CodeController cc;
            late final TextEditingController titleC;
            final stdinC = TextEditingController();
            final undo = UndoHistoryController();
            RunResult? res;
            bool running = false;
            bool outOpen = false;
            bool stdinOpen = false;

            Note get n => widget.note;

            static const TextStyle mono = TextStyle(fontFamily: 'monospace', fontSize: 14, height: 1.5);
            static const StrutStyle strut = StrutStyle(fontFamily: 'monospace', fontSize: 14, height: 1.5, forceStrutHeight: true);

            @override
            void initState() {
              super.initState();
              cc = CodeController(text: n.text, lang: n.lang);
              titleC = TextEditingController(text: n.title);
            }

            @override
            void dispose() {
              Store.I.save();
              cc.dispose();
              titleC.dispose();
              stdinC.dispose();
              super.dispose();
            }

            void _changed() {
              n.text = cc.text;
              n.title = titleC.text;
              n.updated = DateTime.now().millisecondsSinceEpoch;
              Store.I.save();
            }

            void _ins(String s, {int back = 0}) {
              final t = cc.text;
              final sel = cc.selection;
              final start = sel.isValid ? sel.start : t.length;
              final end = sel.isValid ? sel.end : t.length;
              cc.value = TextEditingValue(text: t.replaceRange(start, end, s), selection: TextSelection.collapsed(offset: start + s.length - back));
              _changed();
              setState(() {});
            }

            Future<void> _run() async {
              FocusScope.of(context).unfocus();
              setState(() {
                running = true;
                outOpen = true;
                res = null;
              });
              final r = await runCode(n.lang, cc.text, stdin: stdinC.text);
              if (!mounted) return;
              setState(() {
                running = false;
                res = r;
              });
