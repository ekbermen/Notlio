            Future<void> _newNote(Notebook? nb) async {
              if (nb == null) {
                toast(context, 'Önce bir defter oluştur');
                return;
              }
              if (nb.chars >= kMaxNotebookChars) {
                toast(context, 'Bu defter dolu (5.000.000 harf). Yeni defter aç.');
                return;
              }
              Note note;
              if (dev) {
                final l = await _pickLang();
                if (l == null) return;
                note = Note(lang: l, text: langOf(l).starter);
              } else {
                note = Note();
              }
              nb.notes.add(note);
              if (!mounted) return;
              await openNote(context, nb, note);
            }

            Future<void> _newNb() async {
              final name = await textDialog(context, 'Yeni defter', hint: dev ? 'ör. Python denemeleri' : 'ör. Matematik');
              if (name == null || name.trim().isEmpty) return;
              final nb = Notebook(name: name.trim(), kind: widget.kind, emoji: dev ? '💻' : '📒');
              Store.I.notebooks.add(nb);
              setState(() => selId = nb.id);
              Store.I.refresh();
