          class _AudioTileState extends State<AudioTile> {
            final player = AudioPlayer();
            bool playing = false;
            bool busy = false;
            StreamSubscription? sub;

            @override
            void initState() {
              super.initState();
              sub = player.onPlayerComplete.listen((_) {
                if (mounted) setState(() => playing = false);
              });
            }

            @override
            void dispose() {
              sub?.cancel();
              player.dispose();
              super.dispose();
            }

            Future<void> _toggle() async {
              try {
                if (playing) {
