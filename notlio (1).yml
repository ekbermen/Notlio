      - name: "lib/logo.dart (Notlio logosu, kodla cizilir)"
        working-directory: app
        run: |
          cat > lib/logo.dart << 'NOTLIOEOF'
          import 'package:flutter/material.dart';

          class _LogoPainter extends CustomPainter {
            @override
            void paint(Canvas canvas, Size size) {
              final u = size.width / 1024.0;

              // gradient rounded background
              final rect = Rect.fromLTWH(0, 0, size.width, size.height);
              final bg = Paint()
                ..shader = const LinearGradient(
                  colors: [Color(0xFF6C5CE7), Color(0xFFFD79A8)],
                  begin: Alignment.topLeft,
                  end: Alignment.bottomRight,
                ).createShader(rect);
              canvas.drawRRect(RRect.fromRectAndRadius(rect, Radius.circular(size.width * 0.22)), bg);

              // page with folded corner
              const x0 = 300.0, y0 = 250.0, x1 = 724.0, y1 = 774.0, fold = 120.0;
              final page = Path()
                ..moveTo(x0 * u, y0 * u)
                ..lineTo((x1 - fold) * u, y0 * u)
                ..lineTo(x1 * u, (y0 + fold) * u)
                ..lineTo(x1 * u, y1 * u)
                ..lineTo(x0 * u, y1 * u)
                ..close();
              canvas.drawPath(page, Paint()..color = Colors.white);
              final corner = Path()
                ..moveTo((x1 - fold) * u, y0 * u)
                ..lineTo(x1 * u, (y0 + fold) * u)
                ..lineTo((x1 - fold) * u, (y0 + fold) * u)
                ..close();
              canvas.drawPath(corner, Paint()..color = const Color(0xFFD7D0FA));

              // text lines
              final line = Paint()..color = const Color(0xFFA096EB);
              for (final l in const [[430.0, 300.0], [510.0, 300.0], [590.0, 200.0]]) {
                canvas.drawRRect(
                  RRect.fromRectAndRadius(Rect.fromLTWH((x0 + 50) * u, l[0] * u, l[1] * u, 30 * u), Radius.circular(15 * u)),
                  line,
                );
              }

              // sparkles
              void star(double cx, double cy, double r, Color c) {
                final k = r * 0.22;
                final p = Path()
                  ..moveTo(cx * u, (cy - r) * u)
                  ..lineTo((cx + k) * u, (cy - k) * u)
                  ..lineTo((cx + r) * u, cy * u)
                  ..lineTo((cx + k) * u, (cy + k) * u)
                  ..lineTo(cx * u, (cy + r) * u)
                  ..lineTo((cx - k) * u, (cy + k) * u)
                  ..lineTo((cx - r) * u, cy * u)
                  ..lineTo((cx - k) * u, (cy - k) * u)
                  ..close();
                canvas.drawPath(p, Paint()..color = c);
              }

              star(x1 - 20, y1 - 30, 105, const Color(0xFFFDCB6E));
              star(x1 + 90, y1 - 150, 44, Colors.white);
            }

            @override
            bool shouldRepaint(covariant CustomPainter old) => false;
          }

          class NotlioLogo extends StatelessWidget {
            final double size;
            const NotlioLogo({super.key, this.size = 36});
            @override
            Widget build(BuildContext context) {
              return SizedBox(width: size, height: size, child: CustomPaint(painter: _LogoPainter()));
            }
          }
          NOTLIOEOF

