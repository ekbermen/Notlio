          class SearchTab extends StatefulWidget {
            const SearchTab({super.key});
            @override
            State<SearchTab> createState() => _SearchTabState();
          }

          class _SearchTabState extends State<SearchTab> {
            String q = '';
            String kind = 'all';

            String _snippet(String text, String ql) {
              final i = text.toLowerCase().indexOf(ql);
              if (i < 0) return text.length > 90 ? text.substring(0, 90) : text;
              final s = i - 30 < 0 ? 0 : i - 30;
              final e = i + ql.length + 60 > text.length ? text.length : i + ql.length + 60;
              return (s > 0 ? '…' : '') + text.substring(s, e).replaceAll('\n', ' ') + (e < text.length ? '…' : '');
            }

            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: Store.I,
                builder: (ctx, _) {
                  final ql = q.trim().toLowerCase();
                  var hits = Store.I.allHits().where((h) => kind == 'all' || h.notebook.kind == kind).toList();
                  if (ql.isNotEmpty) {
                    hits = hits
                        .where((h) => h.note.title.toLowerCase().contains(ql) || h.note.text.toLowerCase().contains(ql) || h.note.tags.any((t) => t.toLowerCase().contains(ql)))
                        .toList();
                  }
                  hits.sort((a, b) => b.note.updated.compareTo(a.note.updated));
                  if (ql.isEmpty && hits.length > 15) hits = hits.sublist(0, 15);
                  return Column(children: [
                    Padding(
                      padding: const EdgeInsets.fromLTRB(14, 8, 14, 4),
                      child: TextField(
                        onChanged: (v) => setState(() => q = v),
                        decoration: InputDecoration(
                          hintText: 'Tüm defterlerde ara…',
                          prefixIcon: const Icon(Icons.search),
                          filled: true,
                          border: OutlineInputBorder(borderRadius: BorderRadius.circular(28), borderSide: BorderSide.none),
                        ),
                      ),
                    ),
                    Padding(
                      padding: const EdgeInsets.symmetric(horizontal: 12),
                      child: Row(children: [
                        for (final k in const [['all', 'Hepsi'], ['student', 'Öğrenci'], ['dev', 'Yazılımcı']])
                          Padding(
                            padding: const EdgeInsets.only(right: 8),
                            child: ChoiceChip(label: Text(k[1]), selected: kind == k[0], onSelected: (_) => setState(() => kind = k[0])),
                          ),
                      ]),
                    ),
                    Padding(
                      padding: const EdgeInsets.fromLTRB(16, 8, 16, 0),
                      child: Align(alignment: Alignment.centerLeft, child: Text(ql.isEmpty ? 'Son notlar' : '${hits.length} sonuç', style: const TextStyle(fontSize: 12))),
                    ),
                    Expanded(
                      child: hits.isEmpty
                          ? const Center(child: Text('Sonuç yok'))
                          : ListView.builder(
                              itemCount: hits.length,
                              itemBuilder: (_, i) {
                                final h = hits[i];
                                return ListTile(
                                  leading: Text(h.notebook.emoji, style: const TextStyle(fontSize: 24)),
                                  title: Text(h.note.title.isEmpty ? 'Başlıksız' : h.note.title, maxLines: 1, overflow: TextOverflow.ellipsis),
                                  subtitle: Text('${h.notebook.name} • ${_snippet(h.note.text, ql)}', maxLines: 2, overflow: TextOverflow.ellipsis),
                                  trailing: h.note.isCode ? Text(langOf(h.note.lang).name, style: const TextStyle(fontSize: 11)) : null,
                                  onTap: () => openNote(context, h.notebook, h.note),
                                );
                              },
                            ),
                    ),
                  ]);
                },
              );
            }
          }

          class AiSetupPage extends StatelessWidget {
            const AiSetupPage({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Yapay zeka')),
                body: ListView(padding: const EdgeInsets.all(18), children: [AiSetup(onDone: () => Navigator.pop(context))]),
              );
            }
          }

          class TrashPage extends StatelessWidget {
            const TrashPage({super.key});
            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: Store.I,
                builder: (ctx, _) {
                  final hits = Store.I.allHits(trashed: true);
                  hits.sort((a, b) => b.note.trashedAt.compareTo(a.note.trashedAt));
                  return Scaffold(
                    appBar: AppBar(title: const Text('Çöp kutusu'), actions: [
                      if (hits.isNotEmpty)
                        TextButton(
                          onPressed: () async {
                            if (await confirmDialog(context, 'Çöp kutusu boşaltılsın mı?', body: 'Bu işlem geri alınamaz.', yes: 'Boşalt')) {
                              for (final h in hits) {
                                Store.I.deleteForever(h.note);
                              }
                            }
                          },
                          child: const Text('Boşalt'),
                        ),
                    ]),
                    body: hits.isEmpty
                        ? const Center(child: Text('Çöp kutusu boş 🎉'))
                        : ListView.builder(
                            itemCount: hits.length,
                            itemBuilder: (_, i) {
                              final h = hits[i];
                              return ListTile(
                                title: Text(h.note.title.isEmpty ? 'Başlıksız' : h.note.title, maxLines: 1, overflow: TextOverflow.ellipsis),
                                subtitle: Text('${h.notebook.name} • silindi: ${fmtDate(h.note.trashedAt)}'),
                                trailing: Row(mainAxisSize: MainAxisSize.min, children: [
                                  IconButton(tooltip: 'Geri al', icon: const Icon(Icons.restore), onPressed: () => Store.I.restore(h.note)),
                                  IconButton(tooltip: 'Kalıcı sil', icon: const Icon(Icons.delete_forever, color: Colors.red), onPressed: () => Store.I.deleteForever(h.note)),
                                ]),
                              );
                            },
                          ),
                  );
                },
              );
            }
          }

          class SettingsTab extends StatelessWidget {
            const SettingsTab({super.key});

            Widget _sec(BuildContext context, String t) => Padding(
                  padding: const EdgeInsets.fromLTRB(16, 18, 16, 4),
                  child: Text(t, style: TextStyle(fontSize: 12, fontWeight: FontWeight.w800, color: Theme.of(context).colorScheme.primary)),
                );

            Future<void> _setPass(BuildContext context) async {
              final p1 = TextEditingController();
              final p2 = TextEditingController();
              var encrypt = true;
              final ok = await showDialog<bool>(
                context: context,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setS) => AlertDialog(
                    title: const Text('Parola belirle'),
                    content: Column(mainAxisSize: MainAxisSize.min, children: [
                      TextField(controller: p1, obscureText: true, decoration: const InputDecoration(labelText: 'Parola')),
                      TextField(controller: p2, obscureText: true, decoration: const InputDecoration(labelText: 'Parola (tekrar)')),
                      CheckboxListTile(
                        contentPadding: EdgeInsets.zero,
                        value: encrypt,
                        onChanged: (v) => setS(() => encrypt = v ?? true),
                        title: const Text('Verileri AES ile şifrele', style: TextStyle(fontSize: 14)),
                        subtitle: const Text('Parolayı unutursan notlar kurtarılamaz!', style: TextStyle(fontSize: 11)),
                      ),
                    ]),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(ctx, false), child: const Text('Vazgeç')),
                      FilledButton(onPressed: () => Navigator.pop(ctx, true), child: const Text('Kaydet')),
                    ],
                  ),
                ),
              );
              if (ok != true) return;
              if (p1.text.length < 4 || p1.text != p2.text) {
                if (context.mounted) toast(context, 'Parolalar uyuşmuyor ya da 4 karakterden kısa');
                return;
              }
              await Store.I.setLock(p1.text, encrypt);
              if (context.mounted) toast(context, 'Parola ayarlandı');
            }

            Future<void> _import(BuildContext context) async {
              try {
                final r = await FilePicker.platform.pickFiles(type: FileType.any);
                if (r == null || r.files.isEmpty || r.files.first.path == null) return;
                final raw = await File(r.files.first.path!).readAsString();
                final n = Store.I.importJson(raw);
                if (context.mounted) toast(context, '$n defter içe aktarıldı');
              } catch (e) {
                if (context.mounted) toast(context, 'İçe aktarılamadı: bu bir Notlio yedeği değil');
              }
            }

            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: Store.I,
                builder: (ctx, _) {
                  final s = Store.I;
                  final cs = Theme.of(context).colorScheme;
                  return ListView(children: [
                    _sec(context, 'GÖRÜNÜM'),
                    SwitchListTile(
                      secondary: const Icon(Icons.dark_mode_outlined),
                      title: const Text('Koyu tema'),
                      value: s.dark,
                      onChanged: (v) {
                        s.dark = v;
                        s.refresh();
                      },
                    ),
                    ListTile(
                      leading: const Icon(Icons.palette_outlined),
                      title: const Text('Vurgu rengi'),
                      subtitle: Padding(
                        padding: const EdgeInsets.only(top: 8),
                        child: Wrap(
                          spacing: 10,
                          children: kAccents
                              .map((c) => GestureDetector(
                                    onTap: () {
                                      s.accent = c;
                                      s.refresh();
                                    },
                                    child: Container(
                                      width: 34,
                                      height: 34,
                                      decoration: BoxDecoration(color: Color(c), shape: BoxShape.circle, border: Border.all(color: s.accent == c ? cs.onSurface : Colors.transparent, width: 3)),
                                    ),
                                  ))
                              .toList(),
                        ),
                      ),
                    ),
                    ListTile(
                      leading: const Icon(Icons.text_fields),
                      title: Text('Yazı boyutu (${s.fontSize.round()})'),
                      subtitle: Slider(
                        min: 13,
                        max: 24,
                        divisions: 11,
                        value: s.fontSize,
                        onChanged: (v) {
                          s.fontSize = v;
                          s.refresh();
                        },
                      ),
                    ),
                    _sec(context, 'YAPAY ZEKA'),
                    if (s.hasAi) ...[
                      ListTile(
                        leading: const AiLogo(size: 30),
                        title: Text('Bağlı: ${companyName(s.provider)}'),
                        subtitle: Text('Model: ${s.model}'),
                      ),
                      ListTile(leading: const Icon(Icons.memory), title: const Text('Modeli değiştir'), onTap: () => changeModel(context)),
                      ListTile(
                        leading: const Icon(Icons.vpn_key_outlined),
                        title: const Text('Anahtarı değiştir'),
                        onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => const AiSetupPage())),
                      ),
                      ListTile(
                        leading: const Icon(Icons.link_off),
                        title: const Text('Bağlantıyı kaldır'),
                        onTap: () async {
                          if (await confirmDialog(context, 'Yapay zeka bağlantısı kaldırılsın mı?')) {
                            s.apiKey = '';
                            s.provider = '';
                            s.model = '';
                            s.models = [];
                            s.refresh();
                          }
                        },
                      ),
                    ] else
                      ListTile(
                        leading: const AiLogo(size: 30),
                        title: const Text('Yapay zekayı bağla'),
                        subtitle: const Text('Her şirketin API anahtarı çalışır. İsteğe bağlı.'),
                        onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => const AiSetupPage())),
                      ),
                    _sec(context, 'KOD ÇALIŞTIRMA'),
                    ListTile(
                      leading: const Icon(Icons.cloud_outlined),
                      title: const Text('Çalıştırma sunucusu'),
                      subtitle: Text(s.pistonUrl, style: const TextStyle(fontSize: 12)),
                      onTap: () async {
                        final t = await textDialog(context, 'Piston uyumlu adres', initial: s.pistonUrl);
                        if (t != null && t.trim().startsWith('http')) {
                          s.pistonUrl = t.trim();
                          s.refresh();
                        }
                      },
                    ),
                    _sec(context, 'GÜVENLİK'),
                    if (!s.hasLock)
                      ListTile(leading: const Icon(Icons.lock_outline), title: const Text('Parola belirle'), subtitle: const Text('Uygulama açılırken parola sorar'), onTap: () => _setPass(context))
                    else ...[
                      SwitchListTile(
                        secondary: const Icon(Icons.enhanced_encryption_outlined),
                        title: const Text('Verileri AES ile şifrele'),
                        subtitle: const Text('Dosya telefonda şifreli saklanır'),
                        value: s.encrypted,
                        onChanged: (v) => s.setEncrypt(v),
                      ),
                      ListTile(
                        leading: const Icon(Icons.lock_open),
                        title: const Text('Parolayı kaldır'),
                        onTap: () async {
                          if (await confirmDialog(context, 'Parola kaldırılsın mı?', body: 'Veriler şifresiz saklanır.')) {
                            await s.removeLock();
                          }
                        },
                      ),
                    ],
                    _sec(context, 'VERİ'),
                    ListTile(
                      leading: const Icon(Icons.upload_file),
                      title: const Text('Yedeği dışa aktar'),
                      subtitle: const Text('Tüm defterler tek .json dosyası (API anahtarı hariç)'),
                      onTap: () async {
                        final f = await s.exportFile();
                        await Share.shareXFiles([XFile(f.path)], text: 'Notlio yedeği');
                      },
                    ),
                    ListTile(leading: const Icon(Icons.download), title: const Text('Yedekten içe aktar'), onTap: () => _import(context)),
                    ListTile(
                      leading: const Icon(Icons.delete_outline),
                      title: const Text('Çöp kutusu'),
                      subtitle: Text('${s.allHits(trashed: true).length} not • 30 gün sonra silinir'),
                      onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => const TrashPage())),
                    ),
                    _sec(context, 'HAKKINDA'),
                    const ListTile(
                      leading: Text('🗺️', style: TextStyle(fontSize: 26)),
                      title: Text('Notlio 1.0 • Not×Land'),
                      subtitle: Text('Hesap yok. Reklam yok. Takip yok. Notların sadece senin telefonunda.\nYapay zeka isteğe bağlı: kapalıyken hiçbir şey internete çıkmaz.'),
                      isThreeLine: true,
                    ),
                    const SizedBox(height: 40),
                  ]);
                },
              );
            }
          }

          class LockPage extends StatefulWidget {
            const LockPage({super.key});
            @override
            State<LockPage> createState() => _LockPageState();
          }

          class _LockPageState extends State<LockPage> {
            final c = TextEditingController();
            bool bad = false;
            bool busy = false;

            Future<void> _go() async {
              setState(() {
                busy = true;
                bad = false;
              });
              final ok = await Store.I.unlock(c.text);
              if (!mounted) return;
              setState(() {
                busy = false;
                bad = !ok;
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Center(
                    child: Padding(
                      padding: const EdgeInsets.all(32),
                      child: Column(mainAxisSize: MainAxisSize.min, children: [
                        const NotlioLogo(size: 84),
                        const SizedBox(height: 8),
                        const Text('Notlio', style: TextStyle(fontSize: 28, fontWeight: FontWeight.w800)),
                        const SizedBox(height: 24),
                        TextField(
                          controller: c,
                          obscureText: true,
                          autofocus: true,
                          onSubmitted: (_) => _go(),
                          decoration: InputDecoration(labelText: 'Parola', border: const OutlineInputBorder(), errorText: bad ? 'Parola yanlış' : null),
                        ),
                        const SizedBox(height: 14),
                        FilledButton(onPressed: busy ? null : _go, child: busy ? const SizedBox(width: 18, height: 18, child: CircularProgressIndicator(strokeWidth: 2)) : const Text('Aç')),
                      ]),
                    ),
                  ),
                ),
              );
            }
          }
          NOTLIOEOF

      - name: "lib/main.dart (giriş)"
        working-directory: app
        run: |
          cat > lib/main.dart << 'NOTLIOEOF'
          import 'package:flutter/material.dart';
          import 'models.dart';
          import 'ui.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Store.I.init();
            runApp(const NotlioApp());
          }

          class NotlioApp extends StatelessWidget {
            const NotlioApp({super.key});

            ThemeData _theme(Brightness b) {
              final cs = ColorScheme.fromSeed(seedColor: Color(Store.I.accent), brightness: b);
              return ThemeData(
                useMaterial3: true,
                colorScheme: cs,
                appBarTheme: AppBarTheme(centerTitle: false, backgroundColor: cs.surface, surfaceTintColor: Colors.transparent),
                snackBarTheme: const SnackBarThemeData(behavior: SnackBarBehavior.floating),
              );
            }

            @override
            Widget build(BuildContext context) {
              return AnimatedBuilder(
                animation: Store.I,
                builder: (context, _) => MaterialApp(
                  title: 'Notlio',
                  debugShowCheckedModeBanner: false,
                  theme: _theme(Brightness.light),
                  darkTheme: _theme(Brightness.dark),
                  themeMode: Store.I.dark ? ThemeMode.dark : ThemeMode.light,
                  home: Store.I.locked ? const LockPage() : const HomePage(),
                ),
              );
            }
          }
          NOTLIOEOF

      - name: "Bağımlılıkları indir"
        working-directory: app
        run: flutter pub get

      - name: "Kod analizi (bilgi amaçlı)"
        working-directory: app
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: "Release APK derle"
        working-directory: app
        run: flutter build apk --release

      - name: "APK adını düzenle"
        run: |
          mkdir -p out
          cp app/build/app/outputs/flutter-apk/app-release.apk out/Notlio.apk
          ls -lh out/Notlio.apk

      - name: "Artifact olarak yükle"
        uses: actions/upload-artifact@v4
        with:
          name: Notlio-APK
          path: out/Notlio.apk
          retention-days: 30

      - name: "Releases bölümüne ekle"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: notlio-v1.${{ github.run_number }}
          name: Notlio 1.${{ github.run_number }}
          body: "Notlio APK. İndirip yükle (bilinmeyen kaynaklardan yüklemeye izin ver)."
          files: out/Notlio.apk
