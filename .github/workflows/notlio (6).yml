# NOTLIO - Not x Land
# Tek dosya: uygulamanin tum kodu + APK derleme isi.
#
# KULLANIM
#   1) Bu dosyayi GitHub deposuna su yola koy:  .github/workflows/notlio.yml
#   2) Varsayilan dala kaydet (commit). Actions sekmesinde "Notlio APK" gorunur.
#   3) Actions > Notlio APK > Run workflow (her push/commit'te de otomatik calisir).
#   4) APK: Actions > calisma > Artifacts > Notlio-APK  ve  Releases bolumu.
#
# Ozellikler: Markdown/onizleme, odak sayaci, gorevler, ders programi, AI flashcard/test,
# fotograftan metin, sablonlar, sesli okuma, snippet'ler, bul-degistir, kod haritasi, temalar...
# Dart kodlari asagida sikistirilmis (base64) olarak durur; derleme sirasinda
# lib/ klasorune acilir. Dosya yarim yapistirilirsa sha256 kontrolu net hata verir.
#
name: Notlio APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: notlio-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: APK derle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: "Depoyu al"
        uses: actions/checkout@v4

      - name: "Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: "Flutter kur"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable
          cache: true

      - name: "Flutter projesini olustur"
        run: |
          flutter --version
          flutter create --org com.notlio --project-name notlio --platforms android --description "Notlio - Not x Land" app
          rm -rf app/test
          rm -f app/lib/main.dart
          rm -f app/analysis_options.yaml

      - name: "pubspec.yaml"
        working-directory: app
        run: |
          cat > pubspec.yaml << 'NOTLIOEOF'
          name: notlio
          description: Notlio - Not x Land
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.5.0 <5.0.0'

          dependencies:
            flutter:
              sdk: flutter
            path_provider: ^2.1.4
            http: ^1.2.2
            crypto: ^3.0.5
            encrypt: ^5.0.3
            file_picker: ^8.1.2
            image_picker: ^1.1.2
            share_plus: ^10.0.2
            speech_to_text: ^7.0.0
            webview_flutter: ^4.9.0
            audioplayers: ^6.1.0
            open_filex: ^4.5.0
            flutter_tts: ^4.2.0

          flutter:
            uses-material-design: true
          NOTLIOEOF

      - name: "Android ayarlari (izinler, SDK, ad)"
        working-directory: app
        run: |
          python3 - << 'NOTLIOEOF'
          import re
          mf = 'android/app/src/main/AndroidManifest.xml'
          s = open(mf, encoding='utf-8').read()
          perms = (
              '    <uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
              '    <uses-permission android:name="android.permission.CAMERA"/>\n'
              '    <uses-permission android:name="android.permission.BLUETOOTH"/>\n'
              '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n'
          )
          s = s.replace('<application', perms + '    <application', 1)
          extra = (
              '<intent><action android:name="android.speech.RecognitionService"/></intent>'
              '<intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>'
              '<intent><action android:name="android.intent.action.VIEW"/><data android:mimeType="application/pdf"/></intent>'
              '<intent><action android:name="android.intent.action.VIEW"/><data android:mimeType="*/*"/></intent>'
          )
          if '<queries>' in s:
              s = s.replace('<queries>', '<queries>' + extra, 1)
          else:
              s = s.replace('</manifest>', '<queries>' + extra + '</queries></manifest>', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Notlio"', s, count=1)
          open(mf, 'w', encoding='utf-8').write(s)

          import glob
          for g in glob.glob('android/app/build.gradle*'):
              t = open(g, encoding='utf-8').read()
              t = re.sub(r'minSdk(Version)?\s*=?\s*flutter\.minSdkVersion', 'minSdk = 24', t)
              open(g, 'w', encoding='utf-8').write(t)
              print('minSdk ayarlandi:', g)

          print(open(mf, encoding='utf-8').read())
          NOTLIOEOF

      - name: "Logo ve uygulama ikonu (kodla uretilir)"
        working-directory: app
        run: |
          pip install pillow
          python3 - << 'NOTLIOEOF'
          import os
          from PIL import Image, ImageDraw

          S = 1024
          VIOLET = (108, 92, 231)
          PINK = (253, 121, 168)

          def gradient(size):
              img = Image.new('RGB', (size, size))
              px = img.load()
              for y in range(size):
                  for x in range(size):
                      t = (x + y) / (2.0 * (size - 1))
                      px[x, y] = tuple(int(VIOLET[i] + (PINK[i] - VIOLET[i]) * t) for i in range(3))
              return img.convert('RGBA')

          def star(d, cx, cy, r, fill):
              k = r * 0.22
              d.polygon([(cx, cy - r), (cx + k, cy - k), (cx + r, cy), (cx + k, cy + k),
                         (cx, cy + r), (cx - k, cy + k), (cx - r, cy), (cx - k, cy - k)], fill=fill)

          def foreground():
              # transparent layer, logo inside the adaptive-icon safe zone
              img = Image.new('RGBA', (S, S), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)
              x0, y0, x1, y1 = 300, 250, 724, 774
              fold = 120
              page = (255, 255, 255, 255)
              d.polygon([(x0, y0), (x1 - fold, y0), (x1, y0 + fold), (x1, y1), (x0, y1)], fill=page)
              d.polygon([(x1 - fold, y0), (x1, y0 + fold), (x1 - fold, y0 + fold)], fill=(215, 208, 250, 255))
              line = (160, 150, 235, 255)
              for i, (ya, w) in enumerate([(430, 300), (510, 300), (590, 200)]):
                  d.rounded_rectangle([x0 + 50, ya, x0 + 50 + w - 100 + 100, ya + 30], radius=15, fill=line)
              star(d, x1 - 20, y1 - 30, 105, (253, 203, 110, 255))
              star(d, x1 + 90, y1 - 150, 44, (255, 255, 255, 255))
              return img

          def make(size, img):
              return img.resize((size, size), Image.LANCZOS)

          bg = gradient(S)
          fg = foreground()
          full = bg.copy()
          full.alpha_composite(fg)

          # legacy rounded icon
          mask = Image.new('L', (S, S), 0)
          ImageDraw.Draw(mask).rounded_rectangle([0, 0, S - 1, S - 1], radius=int(S * 0.22), fill=255)
          legacy = Image.new('RGBA', (S, S), (0, 0, 0, 0))
          legacy.paste(full, (0, 0), mask)

          legacy_sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          adaptive_sizes = {'mdpi': 108, 'hdpi': 162, 'xhdpi': 216, 'xxhdpi': 324, 'xxxhdpi': 432}
          res = 'android/app/src/main/res'
          for dens, sz in legacy_sizes.items():
              folder = f'{res}/mipmap-{dens}'
              os.makedirs(folder, exist_ok=True)
              make(sz, legacy).save(f'{folder}/ic_launcher.png')
              make(sz, legacy).save(f'{folder}/ic_launcher_round.png')
          for dens, sz in adaptive_sizes.items():
              folder = f'{res}/mipmap-{dens}'
              make(sz, fg).save(f'{folder}/ic_launcher_foreground.png')
              make(sz, bg).save(f'{folder}/ic_launcher_background.png')

          os.makedirs(f'{res}/mipmap-anydpi-v26', exist_ok=True)
          xml = ('<?xml version="1.0" encoding="utf-8"?>\n'
                 '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                 '    <background android:drawable="@mipmap/ic_launcher_background"/>\n'
                 '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
                 '</adaptive-icon>\n')
          open(f'{res}/mipmap-anydpi-v26/ic_launcher.xml', 'w').write(xml)
          open(f'{res}/mipmap-anydpi-v26/ic_launcher_round.xml', 'w').write(xml)
          print('Ikon dosyalari hazir')
          NOTLIOEOF

