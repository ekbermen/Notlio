                              setState(() => strokes.add(Stroke(0, width < 4 ? 6 : width, [p.dx, p.dy], emoji: stamp)));
                              _commit();
                            },
                            onPanStart: (d) {
                              if (tool == 'stamp') return;
                              final p = _norm(d.localPosition, size);
