          class AiPanel extends StatefulWidget {
            final Note? note;
            final Notebook? notebook;
            final VoidCallback? onApplied;
            final String? initial;
            final ScrollController scroll;
            const AiPanel({super.key, this.note, this.notebook, this.onApplied, this.initial, required this.scroll});
            @override
            State<AiPanel> createState() => _AiPanelState();
          }

          class _AiPanelState extends State<AiPanel> {
            final input = TextEditingController();
            final List<ChatMsg> msgs = [];
            bool loading = false;
            String scope = 'all';

            @override
            void initState() {
              super.initState();
              scope = widget.note != null ? 'note' : (widget.notebook != null ? 'notebook' : 'all');
              if (widget.initial != null && Store.I.hasAi) {
                WidgetsBinding.instance.addPostFrameCallback((_) => _send(widget.initial!));
              }
            }

            String _system() {
              final ctx = scope == 'none' ? '' : Store.I.contextFor(scope, widget.notebook, widget.note);
              return 'Sen Notlio not uygulamasının yapay zeka asistanısın. Kullanıcı Türkçe konuşur; başka dilde yazarsa o dilde cevap ver. Kısa ve net ol.\n'
                  'Kullanıcının notunda hata varsa (yazım, mantık, kod) bul ve düzelt. Bir işlem isterse (özetle, düzelt, çevir, kod ekle, yeni not aç) yap.\n'
                  'Notu DEĞİŞTİRMEK için cevabında şu bloğu ver ve içine notun TAM yeni halini yaz:\n'
                  '```notlio-edit\n...notun tam yeni metni...\n```\n'
                  'Yeni not oluşturmak için:\n'
                  '```notlio-new:Başlık\n...içerik...\n```\n'
                  'Kod notlarında blok içine sadece kodu yaz (içeride ``` veya dil adı yazma). Bloğun dışında en fazla birkaç cümle açıklama yaz.\n'
                  'Aşağıdaki bağlam kullanıcının notlarıdır:\n'
                  '$ctx';
            }

            Future<void> _send(String text) async {
              final t = text.trim();
              if (t.isEmpty || loading) return;
              setState(() {
                msgs.add(ChatMsg('user', t));
                loading = true;
              });
              input.clear();
              _toEnd();
              try {
                final hist = msgs.length > 12 ? msgs.sublist(msgs.length - 12) : List<ChatMsg>.from(msgs);
                final ans = await aiChat(hist, _system());
                if (!mounted) return;
                setState(() => msgs.add(ChatMsg('assistant', ans.isEmpty ? '(boş cevap)' : ans)));
              } catch (e) {
                if (!mounted) return;
                setState(() => msgs.add(ChatMsg('assistant', '⚠️ Hata: ${e.toString().replaceFirst('Exception: ', '')}')));
              }
              if (!mounted) return;
              setState(() => loading = false);
              _toEnd();
            }

            void _toEnd() {
              Future.delayed(const Duration(milliseconds: 150), () {
                if (widget.scroll.hasClients) {
                  widget.scroll.animateTo(widget.scroll.position.maxScrollExtent, duration: const Duration(milliseconds: 200), curve: Curves.easeOut);
                }
              });
            }

            void _apply(String kind, String title, String body) {
              final s = Store.I;
              var b = body;
              if (b.endsWith('\n')) b = b.substring(0, b.length - 1);
              if (kind == 'edit' && widget.note != null) {
                widget.note!.text = b;
                widget.note!.updated = DateTime.now().millisecondsSinceEpoch;
                s.refresh();
                widget.onApplied?.call();
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Not güncellendi')));
              } else {
                final nb = widget.notebook ?? s.notebookOf(widget.note ?? Note()) ?? (s.notebooks.isNotEmpty ? s.notebooks.first : null);
                if (nb == null) return;
                nb.notes.add(Note(title: title.isEmpty ? 'AI notu' : title, text: b, lang: widget.note?.lang ?? ''));
                s.refresh();
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('"${title.isEmpty ? 'AI notu' : title}" oluşturuldu')));
              }
            }

            Widget _bubble(ChatMsg m) {
              final me = m.role == 'user';
              final cs = Theme.of(context).colorScheme;
              final actions = <Widget>[];
              if (!me) {
                final re = RegExp(r'```notlio-(edit|new)(?::([^\n]*))?\n([\s\S]*?)```');
                for (final mt in re.allMatches(m.text)) {
                  final kind = mt.group(1)!;
                  final title = (mt.group(2) ?? '').trim();
                  final body = mt.group(3) ?? '';
                  if (kind == 'edit' && widget.note == null) continue;
                  actions.add(Padding(
                    padding: const EdgeInsets.only(top: 6, right: 6),
                    child: FilledButton.tonalIcon(
                      icon: Icon(kind == 'edit' ? Icons.check : Icons.note_add, size: 18),
                      label: Text(kind == 'edit' ? 'Notu güncelle' : 'Yeni not: ${title.isEmpty ? "AI notu" : title}'),
                      onPressed: () => _apply(kind, title, body),
                    ),
                  ));
                }
              }
              return Align(
                alignment: me ? Alignment.centerRight : Alignment.centerLeft,
                child: Container(
                  margin: const EdgeInsets.symmetric(vertical: 4),
                  padding: const EdgeInsets.all(12),
                  constraints: BoxConstraints(maxWidth: MediaQuery.of(context).size.width * 0.88),
                  decoration: BoxDecoration(
                    color: me ? cs.primaryContainer : cs.surfaceContainerHighest,
                    borderRadius: BorderRadius.circular(16),
                  ),
                  child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                    SelectableText(m.text, style: const TextStyle(fontSize: 14, height: 1.4)),
                    if (actions.isNotEmpty) Wrap(children: actions),
                    if (!me)
                      InkWell(
                        onTap: () {
                          Clipboard.setData(ClipboardData(text: m.text));
                          ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Kopyalandı')));
                        },
                        child: const Padding(padding: EdgeInsets.only(top: 6), child: Icon(Icons.copy, size: 14)),
                      ),
                  ]),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final s = Store.I;
              if (!s.hasAi) {
                return ListView(controller: widget.scroll, padding: const EdgeInsets.all(18), children: [
                  Row(children: const [AiLogo(size: 36), SizedBox(width: 10), Text('Notlio AI', style: TextStyle(fontSize: 20, fontWeight: FontWeight.w800))]),
                  const SizedBox(height: 14),
                  AiSetup(onDone: () => setState(() {})),
