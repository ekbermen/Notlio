      - name: "Bagimliliklari indir"
        working-directory: app
        run: flutter pub get

      - name: "Kod analizi (bilgi amacli)"
        working-directory: app
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: "Release APK derle"
        working-directory: app
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: "HATA OZETI (build basarisizsa)"
        if: failure()
        working-directory: app
        run: |
          echo "=============== HATA OZETI ==============="
          grep -n -B3 -A14 -E "What went wrong|error:|Error:|e: file|FAILURE|Execution failed|Could not|requires|Missing class" build.log | head -150 || true
          echo "=========================================="

      - name: "APK adini duzenle"
        run: |
          mkdir -p out
          cp app/build/app/outputs/flutter-apk/app-release.apk out/Notlio.apk
          ls -lh out/Notlio.apk

      - name: "Artifact olarak yukle"
        uses: actions/upload-artifact@v4
        with:
          name: Notlio-APK
          path: out/Notlio.apk
          retention-days: 30

      - name: "Releases bolumune ekle"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: notlio-v1.${{ github.run_number }}
          name: Notlio 1.${{ github.run_number }}
          body: "Notlio APK. Indirip yukle (bilinmeyen kaynaklardan yuklemeye izin ver)."
          files: out/Notlio.apk
