      - name: "lib/code.dart (yazılımcı editörü)"
        working-directory: app
        run: |
          cat > lib/code.dart << 'NOTLIOEOF'
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:share_plus/share_plus.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'ai.dart';
          import 'common.dart';
          import 'editor.dart';
          import 'models.dart';
          import 'runner.dart';

          const String _kw =
              'if|else|elif|for|while|do|switch|case|break|continue|return|class|struct|enum|interface|function|def|fn|func|fun|var|let|const|val|int|long|short|float|double|char|bool|boolean|string|String|void|public|private|protected|static|final|new|this|self|import|from|include|using|package|namespace|try|catch|except|finally|throw|throws|raise|null|nil|None|true|false|True|False|and|or|not|in|is|async|await|lambda|yield|select|insert|into|values|create|table|update|delete|where|join|order|by|group|limit|print|echo|println|cout|printf|console|mut|impl|pub|use|mod|match|loop|go|defer|chan|range|override|abstract|extends|implements|typeof|readonly|object|when|init|SELECT|INSERT|INTO|VALUES|CREATE|TABLE|UPDATE|DELETE|WHERE|FROM';

          final Map<String, RegExp> _reCache = {};

          RegExp _regexFor(String lang) {
            return _reCache.putIfAbsent(lang, () {
              String cmt;
              if (lang == 'python' || lang == 'yaml' || lang == 'php') {
                cmt = r'#[^\n]*|//[^\n]*';
              } else if (lang == 'sql') {
                cmt = r'--[^\n]*';
              } else {
                cmt = r'//[^\n]*';
              }
              final pre = (lang == 'c' || lang == 'cpp' || lang == 'csharp') ? r'|#\w+' : '';
              final src = '($cmt|/\\*[\\s\\S]*?\\*/|<!--[\\s\\S]*?-->)'
                  '|("(?:\\\\.|[^"\\\\\\n])*"|\'(?:\\\\.|[^\'\\\\\\n])*\')'
                  '|(\\b\\d+(?:\\.\\d+)?\\b)'
                  '|(\\b(?:$_kw)\\b|</?[A-Za-z][\\w-]*$pre)';
              return RegExp(src);
            });
          }

          class CodeController extends TextEditingController {
            String lang;
            CodeController({String? text, required this.lang}) : super(text: text);

            @override
            TextSpan buildTextSpan({required BuildContext context, TextStyle? style, required bool withComposing}) {
              final t = text;
              final base = style ?? const TextStyle();
              if (t.length > 150000) return TextSpan(style: base, text: t);
              final dark = Theme.of(context).brightness == Brightness.dark;
              final cCmt = dark ? const Color(0xFF7F8C8D) : const Color(0xFF8A8F98);
              final cStr = dark ? const Color(0xFF9BE28B) : const Color(0xFF2E8B57);
              final cNum = dark ? const Color(0xFFFFB86C) : const Color(0xFFD35400);
              final cKw = dark ? const Color(0xFFBD93F9) : const Color(0xFF6C5CE7);
              final spans = <TextSpan>[];
              var last = 0;
              for (final m in _regexFor(lang).allMatches(t)) {
                if (m.start > last) spans.add(TextSpan(text: t.substring(last, m.start)));
                Color col;
                var bold = false;
                if (m.group(1) != null) {
                  col = cCmt;
                } else if (m.group(2) != null) {
                  col = cStr;
                } else if (m.group(3) != null) {
                  col = cNum;
                } else {
                  col = cKw;
                  bold = true;
                }
                spans.add(TextSpan(text: m.group(0), style: TextStyle(color: col, fontWeight: bold ? FontWeight.w600 : FontWeight.normal)));
                last = m.end;
              }
              if (last < t.length) spans.add(TextSpan(text: t.substring(last)));
              return TextSpan(style: base, children: spans);
            }
          }

          class IndentFormatter extends TextInputFormatter {
            @override
            TextEditingValue formatEditUpdate(TextEditingValue o, TextEditingValue n) {
              if (n.text.length != o.text.length + 1) return n;
              final pos = n.selection.baseOffset;
              if (pos < 1 || pos > n.text.length || n.text[pos - 1] != '\n') return n;
              final before = n.text.substring(0, pos - 1);
              final ls = before.lastIndexOf('\n') + 1;
              final line = before.substring(ls);
              final ind = RegExp(r'^[ \t]*').firstMatch(line)!.group(0)!;
              final tr = line.trimRight();
              var extra = '';
              if (tr.endsWith('{') || tr.endsWith(':') || tr.endsWith('(') || tr.endsWith('[')) extra = '    ';
              final ins = ind + extra;
              if (ins.isEmpty) return n;
              final nt = n.text.substring(0, pos) + ins + n.text.substring(pos);
              return TextEditingValue(text: nt, selection: TextSelection.collapsed(offset: pos + ins.length));
            }
          }

