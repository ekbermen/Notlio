                            .map((l) => ActionChip(
                                  avatar: Icon(l.local ? Icons.phone_android : Icons.cloud_outlined, size: 16),
                                  label: Text(l.name),
                                  onPressed: () => Navigator.pop(ctx, l.id),
                                ))
                            .toList(),
                      ),
                    ]),
                  ),
