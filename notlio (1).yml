          class LimitFormatter extends TextInputFormatter {
            final Notebook nb;
            LimitFormatter(this.nb);
            @override
            TextEditingValue formatEditUpdate(TextEditingValue oldV, TextEditingValue newV) {
              final delta = newV.text.length - oldV.text.length;
              if (delta > 0 && nb.chars + delta > kMaxNotebookChars) return oldV;
              return newV;
            }
          }

          String attTypeOf(String path) {
            final e = path.split('.').last.toLowerCase();
            if (['jpg', 'jpeg', 'png', 'webp', 'bmp', 'heic'].contains(e)) return 'image';
            if (e == 'gif') return 'gif';
            if (['mp3', 'm4a', 'wav', 'ogg', 'aac', 'flac', 'opus', 'amr'].contains(e)) return 'audio';
            return 'file';
          }

          bool isTextFile(String path) {
            final e = path.split('.').last.toLowerCase();
            return ['txt', 'md', 'json', 'csv', 'xml', 'yml', 'yaml', 'html', 'css', 'js', 'py', 'c', 'cpp', 'cs', 'java', 'kt', 'php', 'go', 'rs', 'sql', 'log', 'ini']
                .contains(e);
          }

          class NoteEditorPage extends StatefulWidget {
            final Note note;
            final Notebook nb;
            const NoteEditorPage({super.key, required this.note, required this.nb});
            @override
            State<NoteEditorPage> createState() => _NoteEditorPageState();
          }

          class _NoteEditorPageState extends State<NoteEditorPage> {
            late final TextEditingController tc;
            late final TextEditingController titleC;
            final undo = UndoHistoryController();
            final focus = FocusNode();
            final speech = stt.SpeechToText();
            bool listening = false;
            bool speechOk = false;

            Note get n => widget.note;

            @override
            void initState() {
              super.initState();
              tc = TextEditingController(text: n.text);
              titleC = TextEditingController(text: n.title);
            }

            @override
            void dispose() {
              speech.stop();
              Store.I.save();
              tc.dispose();
              titleC.dispose();
              focus.dispose();
              super.dispose();
            }

            void _changed() {
              n.text = tc.text;
              n.title = titleC.text;
              n.updated = DateTime.now().millisecondsSinceEpoch;
              Store.I.save();
            }

            void _insert(String s) {
              final t = tc.text;
              final sel = tc.selection;
              final start = sel.isValid ? sel.start : t.length;
              final end = sel.isValid ? sel.end : t.length;
              if (widget.nb.chars + s.length - (end - start) > kMaxNotebookChars) {
                toast(context, 'Defter sınırına ulaşıldı (5.000.000 harf)');
                return;
              }
              tc.value = TextEditingValue(text: t.replaceRange(start, end, s), selection: TextSelection.collapsed(offset: start + s.length));
              _changed();
            }

            void _checkbox() {
              final t = tc.text;
              final sel = tc.selection;
              final pos = sel.isValid ? sel.start : t.length;
              final ls = pos == 0 ? 0 : t.lastIndexOf('\n', pos - 1) + 1;
              String nt;
              var off = pos;
              if (t.startsWith('☐ ', ls)) {
                nt = t.replaceRange(ls, ls + 2, '☑ ');
              } else if (t.startsWith('☑ ', ls)) {
                nt = t.replaceRange(ls, ls + 2, '☐ ');
              } else {
                nt = t.replaceRange(ls, ls, '☐ ');
                off = pos + 2;
              }
              tc.value = TextEditingValue(text: nt, selection: TextSelection.collapsed(offset: off));
              _changed();
            }

            void _addAtt(Attachment a) {
              setState(() => n.atts.add(a));
              _changed();
            }

            Future<void> _pickImage() async {
              final src = await showModalBottomSheet<ImageSource>(
                context: context,
                builder: (ctx) => SafeArea(
                  child: Column(mainAxisSize: MainAxisSize.min, children: [
                    ListTile(leading: const Icon(Icons.photo_library), title: const Text('Galeri'), onTap: () => Navigator.pop(ctx, ImageSource.gallery)),
                    ListTile(leading: const Icon(Icons.photo_camera), title: const Text('Kamera'), onTap: () => Navigator.pop(ctx, ImageSource.camera)),
                  ]),
                ),
              );
              if (src == null) return;
              try {
                final x = await ImagePicker().pickImage(source: src, imageQuality: 85, maxWidth: 2000);
                if (x == null) return;
                final p = await Store.I.keepFile(x.path, x.name.isEmpty ? 'foto.jpg' : x.name);
                _addAtt(Attachment(type: attTypeOf(p), path: p, name: x.name));
              } catch (e) {
                if (mounted) toast(context, 'Resim eklenemedi: $e');
              }
            }

            Future<void> _pickFile(FileType type, {List<String>? ext}) async {
              try {
                final r = await FilePicker.platform.pickFiles(type: type, allowedExtensions: ext);
                if (r == null || r.files.isEmpty || r.files.first.path == null) return;
                final f = r.files.first;
                final p = await Store.I.keepFile(f.path!, f.name);
                _addAtt(Attachment(type: attTypeOf(p), path: p, name: f.name));
              } catch (e) {
                if (mounted) toast(context, 'Dosya eklenemedi: $e');
              }
            }

            Future<void> _toggleMic() async {
              if (listening) {
                await speech.stop();
                if (mounted) setState(() => listening = false);
                return;
              }
              if (!speechOk) {
                speechOk = await speech.initialize(
                  onStatus: (s) {
                    if ((s == 'done' || s == 'notListening') && mounted) setState(() => listening = false);
                  },
                  onError: (e) {
                    if (mounted) {
                      setState(() => listening = false);
                      toast(context, 'Ses hatası: ${e.errorMsg}');
                    }
                  },
                );
              }
              if (!speechOk) {
                if (mounted) toast(context, 'Konuşma tanıma kullanılamıyor. Mikrofon iznini ve Google konuşma servisini kontrol et.');
                return;
              }
              setState(() => listening = true);
              speech.listen(
                onResult: (r) {
                  if (r.finalResult && r.recognizedWords.isNotEmpty) {
                    final t = tc.text;
                    final sp = (t.isEmpty || t.endsWith(' ') || t.endsWith('\n')) ? '' : ' ';
                    _insert('$sp${r.recognizedWords}');
                  }
                },
                localeId: 'tr_TR',
                listenFor: const Duration(minutes: 2),
                pauseFor: const Duration(seconds: 6),
              );
            }

